name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# The backend job auto-commits coverage.svg after a successful run on main.
# Read-only is the default; we grant write only where we need it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Backend — pytest + coverage against a real Postgres + Redis.
  # ---------------------------------------------------------------------------
  backend:
    name: backend (pytest + coverage)
    runs-on: ubuntu-latest
    # Auto-committing the coverage badge needs write access to the repo —
    # only granted on the main-branch push, never on PRs (which may be
    # from forks where the GITHUB_TOKEN can't push back).
    permissions:
      contents: write

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: aigov
          POSTGRES_PASSWORD: aigov
          POSTGRES_DB: aigov
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # Production DSN — used by alembic and by the app's module-level engine.
      # The conftest creates a separate `aigov_test` DB on the same cluster
      # for the test session, leaving the migrated `aigov` DB untouched.
      DATABASE_URL: postgresql+asyncpg://aigov:aigov@localhost:5432/aigov
      TEST_DATABASE_URL: postgresql+asyncpg://aigov:aigov@localhost:5432/aigov_test
      REDIS_URL: redis://localhost:6379/0
      # Strong enough to pass the weak-secret guard at boot — CI-only, not real.
      SECRET_KEY: ci-${{ github.run_id }}-${{ github.sha }}
      DEBUG: "true"
      ENVIRONMENT: ci

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies (incl. test extras)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install coverage-badge

      - name: Apply migrations against CI Postgres
        run: alembic upgrade head

      - name: Run pytest with coverage
        run: |
          pytest tests/ -v \
            --cov=app --cov=services \
            --cov-report=xml --cov-report=term

      - name: Generate coverage badge
        if: success()
        run: coverage-badge -f -o coverage.svg

      - name: Commit updated coverage badge
        # Only on direct push to main — never on PRs.
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore(ci): update coverage badge [skip ci]"
          file_pattern: backend/coverage.svg
          commit_user_name: github-actions[bot]
          commit_user_email: 41898282+github-actions[bot]@users.noreply.github.com

      - name: Upload coverage.xml as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: backend/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend — type-check + production build.
  # ---------------------------------------------------------------------------
  frontend:
    name: frontend (build + type-check)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit

      - name: Production build
        # `npm run build` already runs tsc, but the dedicated type-check
        # step above fails faster on type errors with a cleaner log.
        run: npm run build
