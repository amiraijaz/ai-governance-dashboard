[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigovkit"
version = "0.2.0"
description = "Vigil AI Governance SDK — one-line LLM call logging plus evals (LLM-as-judge, RAG metrics, drift)"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Amir Aijaz", email = "amirejaz790@gmail.com" }]
keywords = [
  "llm",
  "ai-governance",
  "evaluation",
  "observability",
  "safety",
  "compliance",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "anthropic>=0.34",
  "openai>=1.40",
]

[project.optional-dependencies]
# Local RAG execution pulls Ragas + LangChain + datasets/pyarrow (~150 MB).
# Judge and drift do NOT need this — they use only httpx + stdlib.
evals = [
  "ragas>=0.1.21",
  "datasets>=2.21.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://vigil-amir.vercel.app"
Repository = "https://github.com/amiraijaz/ai-governance-dashboard"
Documentation = "https://github.com/amiraijaz/ai-governance-dashboard#readme"
Dataset = "https://huggingface.co/datasets/Vigil-ai/governance-bench-v1"
Issues = "https://github.com/amiraijaz/ai-governance-dashboard/issues"

[tool.setuptools.packages.find]
include = ["aigovkit*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
