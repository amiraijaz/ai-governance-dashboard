[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aigov"
version = "0.2.0"
description = "AI Governance SDK — one-line LLM call logging plus evals (LLM-as-judge, RAG metrics, drift)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Amir Aijaz" }]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6.0",
  "anthropic>=0.34",
  "openai>=1.40",
]

[project.optional-dependencies]
# Local RAG execution pulls Ragas + LangChain + datasets/pyarrow (~150 MB).
# Judge and drift do NOT need this — they use only httpx + stdlib.
evals = [
  "ragas>=0.1.21",
  "datasets>=2.21.0",
  "langchain-openai>=0.2.0",
  "langchain-anthropic>=0.2.0",
]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/amiraijaz/ai-governance-dashboard"
Repository = "https://github.com/amiraijaz/ai-governance-dashboard"

[tool.setuptools.packages.find]
include = ["aigov*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::UserWarning",
]
